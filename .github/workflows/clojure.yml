name: Clojure CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    container:
      image: clojure:temurin-17-tools-deps-bookworm

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    ## This is optional but will speed up clojure steps
    - name: Cache mvn/git deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-deps
      with:
        path: |
          /root/.gitlibs
          /root/.m2
        key: ${{ runner.os }}-${{ hashFiles('**/deps.edn') }}

    ## The clojure tools-deps image has very little installed software,
    ## install minimum requirements for the foundationdb one
    - name: Install curl
      run: |
        apt-get update
        apt-get -qyy install curl

    ## Installs the official client + server packages from the apple/foundationdb
    ## release (same as foundationdb-rs/foundationdb-actions-install, which is not
    ## allowed in this org). The server package starts a local single-node cluster.
    ## Checksums are the .sha256 files published alongside the release assets.
    - name: Install foundationdb
      env:
        FDB_VERSION: 7.3.57
        FDB_CLIENTS_SHA256: bf5b2c2db31bff4276825df37d291aed80431776ba333f8530a0f7c5aeec011d
        FDB_SERVER_SHA256: caced69c939dab08c9b4dc7637f36ba6522f3dfa535071655bbb85902cf945ad
      run: |
        set -eu
        base_url="https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}"
        clients="foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
        server="foundationdb-server_${FDB_VERSION}-1_amd64.deb"
        curl -fsSL -o "/tmp/${clients}" "${base_url}/${clients}"
        curl -fsSL -o "/tmp/${server}" "${base_url}/${server}"
        printf '%s  %s\n' \
          "${FDB_CLIENTS_SHA256}" "/tmp/${clients}" \
          "${FDB_SERVER_SHA256}" "/tmp/${server}" | sha256sum -c -
        dpkg -i "/tmp/${clients}"
        dpkg -i "/tmp/${server}"

    - name: Check
      run: clojure -T:project check

    - name: Test
      run: clojure -T:project test

    - name: Lint
      run: clojure -T:project lint

    - name: Format
      run: clojure -T:project format-check
